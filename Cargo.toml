[package]
name = "tinyllm"
version = "0.1.0"
edition = "2024"
description = "A small LLM serving engine for Llama-family models"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
fancy-regex = "0.20.0"
futures-util = "0.3"
minijinja = { version = "3.1.0", features = ["loop_controls", "preserve_order", "serde"] }
minijinja-contrib = { version = "3.1.0", features = ["pycompat"] }
regex-syntax = "0.8.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["net", "rt-multi-thread", "signal", "sync"] }
tower-http = { version = "0.6", features = ["cors"] }
unicode-normalization = "0.1.26"

[profile.release]
codegen-units = 1
lto = "thin"
